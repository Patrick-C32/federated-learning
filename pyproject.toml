[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2-federated-learning"
version = "1.0.0"
description = "CSU44000 Assignment 2: Federated Learning experiments with PyTorch and Flower"
dependencies = [
    "flwr[simulation,dp]>=1.44.0",
    "flwr-datasets[vision]>=0.6.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "student"
flwr-version-target = "1.44.0"

[tool.flwr.app.components]
serverapp = "a2fl.server_app:app"
clientapp = "a2fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 30
fraction-evaluate = 1.0
local-epochs = 1
learning-rate = 0.01
batch-size = 32
num-clients = 10
seed = 0
dataset = "cifar10"
alpha = 0.0
run-name = "baseline"
init-model = ""
marker-client = -1
marker-share = 0.5
forget-client = -1
unlearn-mode = "none"
ascent-steps = 50
ascent-radius = 0.3
save-client-model = -1
dp-noise = -1.0
dp-clip = 1.0
dp-delta = 0.001
# Folder for results/ and models/ (flwr runs the apps in the local SuperLink's working directory)
out-dir = ""
